<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Simplified forestry metrics workflow</title>
  <desc id="desc">Four stages: forestry reports, AI-assisted extraction, human validation, and reporting comparison.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0f342b"/>
      <stop offset="1" stop-color="#245b4b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <g fill="none" stroke="#b9ddcf" stroke-width="4" stroke-linecap="round">
    <path d="M270 150h65"/>
    <path d="M320 137l15 13-15 13"/>
    <path d="M565 150h65"/>
    <path d="M615 137l15 13-15 13"/>
    <path d="M860 150h65"/>
    <path d="M910 137l15 13-15 13"/>
  </g>
  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(45,55)">
      <rect width="225" height="190" rx="20" fill="#ffffff"/>
      <circle cx="112.5" cy="58" r="30" fill="#e9f3ef"/>
      <path d="M98 43h29v31H98zM104 50h17M104 57h17M104 64h12" fill="none" stroke="#1d5949" stroke-width="3" stroke-linecap="round"/>
      <text x="112.5" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="#153d33">Forestry reports</text>
      <text x="112.5" y="150" text-anchor="middle" font-size="15" fill="#4a5f59">Approved PDF documents</text>
    </g>
    <g transform="translate(340,55)">
      <rect width="225" height="190" rx="20" fill="#ffffff"/>
      <circle cx="112.5" cy="58" r="30" fill="#e9f3ef"/>
      <path d="M96 58h33M112.5 41v34M101 47l23 23M124 47l-23 23" fill="none" stroke="#1d5949" stroke-width="3" stroke-linecap="round"/>
      <text x="112.5" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#153d33">AI assistance</text>
      <text x="112.5" y="145" text-anchor="middle" font-size="15" fill="#4a5f59">Find candidate metrics</text>
      <text x="112.5" y="168" text-anchor="middle" font-size="15" fill="#4a5f59">and supporting text</text>
    </g>
    <g transform="translate(635,55)">
      <rect width="225" height="190" rx="20" fill="#ffffff"/>
      <circle cx="112.5" cy="58" r="30" fill="#e9f3ef"/>
      <path d="M96 59l10 10 23-25" fill="none" stroke="#1d5949" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="112.5" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#153d33">Human review</text>
      <text x="112.5" y="145" text-anchor="middle" font-size="15" fill="#4a5f59">Verify against the</text>
      <text x="112.5" y="168" text-anchor="middle" font-size="15" fill="#4a5f59">original source</text>
    </g>
    <g transform="translate(930,55)">
      <rect width="225" height="190" rx="20" fill="#ffffff"/>
      <circle cx="112.5" cy="58" r="30" fill="#e9f3ef"/>
      <path d="M94 71V55h10v16zM109 71V43h10v28zM124 71V50h10v21z" fill="#1d5949"/>
      <text x="112.5" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#153d33">Comparison</text>
      <text x="112.5" y="145" text-anchor="middle" font-size="15" fill="#4a5f59">Review alongside</text>
      <text x="112.5" y="168" text-anchor="middle" font-size="15" fill="#4a5f59">reporting information</text>
    </g>
  </g>
